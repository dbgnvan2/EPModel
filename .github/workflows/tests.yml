# Runs the whole suite on a blank machine: no built index, no ~/.config, nothing
# installed beyond requirements.txt. Every check lives in the suite itself
# (tests/); this file only installs and invokes it.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each version here was run from a fresh virtualenv with only
        # requirements.txt installed before it was listed (2026-10-06).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests/ -q
