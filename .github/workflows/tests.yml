# Runs the whole suite on a blank machine: no built index, no ~/.config, nothing
# installed beyond requirements.txt. Every check lives in the suite itself
# (tests/); this file only installs and invokes it.
name: tests

on:
  push:
  pull_request:
  # Started by hand from the Actions tab; runs the ensemble job below as well as the suite.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each version here was run from a fresh virtualenv with only
        # requirements.txt installed before it was listed (2026-10-06).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/test_version_1_status.py reads the tag version-1, which a shallow checkout leaves out.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests/ -q

  # The `ensemble`-marked criterion tests, which pytest.ini leaves out of the default run (they take minutes each).
  # Never on a push: only when started by hand (T-223).
  ensemble:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Ensemble criteria
        run: python -m pytest tests/ -q -m ensemble
