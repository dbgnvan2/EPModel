[pytest]
# Phase C plan D7: criterion tests run over ensembles and take minutes; they carry the
# `ensemble` marker and are excluded from the default run. `python3 -m pytest -m ensemble`
# runs them. The default suite checks the committed record instead (test_ensemble_record.py).
markers =
    ensemble: an M11.C criterion over an ensemble (excluded from the default run)
# -rfEs: pytest's default summary (failures, errors) plus every skip with its reason, so a check that
# could not run here (tests/test_python_versions.py without its interpreter) is named, not silent.
# x: every expected failure with its reason too, so an open-batch failure (tests/open_batch.py) prints its cause.
addopts = -m "not ensemble" -rfEsx
