[pytest]
# Phase C plan D7: criterion tests run over ensembles and take minutes; they carry the
# `ensemble` marker and are excluded from the default run. `python3 -m pytest -m ensemble`
# runs them. The default suite checks the committed record instead (test_ensemble_record.py).
markers =
    ensemble: an M11.C criterion over an ensemble (excluded from the default run)
addopts = -m "not ensemble"
